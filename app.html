    <script>
      // 详情页漏斗完整性检查（移植自fastofeeds反作弊方案）：结果页请求广告前
      // 必须确认这个channel真实经过了"详情页加载→词条展示→词条点击"，缺任一
      // 环节都不请求广告。这条不依赖clickid，SEO自然流量和投放流量统一适用——
      // 挡的是直接拿结果页URL批量刷量/爬虫这类最低成本的假量路径
      function reportFunnelBlock(reason) {
        if (window.pushEventParamsToGtm) {
          window.pushEventParamsToGtm("Q_AR_NOT", { why_ad_block: reason });
        }
      }
      function handleRequestAdByChannel(key, val, req) {
        const searchParams = new URLSearchParams(window.location.search);
        // URL没带channel时，兜底读详情页mounted()写的hi_channel_fallback cookie
        // （文章自带channel、URL本身没带的场景）——不依赖改写URL，保证同一次
        // 访问里详情页记录的漏斗状态和结果页读到的channel用的是同一个值
        const channel = searchParams.has("channel")
          ? searchParams.get("channel")
          : window.getCookie("hi_channel_fallback") || "";
        if (!window.getCookie("requestAdByChannel")) {
          if (req) {
            if (!key) reportFunnelBlock("detail_not_mounted");
            return false;
          }
          let buffer = {};
          buffer[channel] = {};
          buffer[channel][key] = val;
          setCookieToDay("requestAdByChannel", JSON.stringify(buffer));
        } else {
          try {
            let buffer = JSON.parse(window.getCookie("requestAdByChannel"));
            if (!buffer[channel]) {
              if (req) {
                if (!key) reportFunnelBlock("detail_not_mounted");
                return false;
              }
              buffer[channel] = {};
              buffer[channel][key] = val;
              setCookieToDay("requestAdByChannel", JSON.stringify(buffer));
            } else {
              if (req) {
                if (
                  !buffer[channel].first &&
                  buffer[channel]?.mounted &&
                  buffer[channel]?.query_ad &&
                  buffer[channel]?.click_ad
                ) {
                  buffer[channel].first = val;
                  setCookieToDay("requestAdByChannel", JSON.stringify(buffer));
                  return true;
                } else if (buffer[channel].first && buffer[channel].first !== "ok" && !key) {
                  // 完成过一次完整漏斗后，同渠道后续请求不再重新校验四项是否
                  // 齐全，只做次数计数上报，不限制请求次数
                  buffer[channel].requestSeq = (buffer[channel].requestSeq || 1) + 1;
                  setCookieToDay("requestAdByChannel", JSON.stringify(buffer));
                  if (window.pushEventParamsToGtm) {
                    window.pushEventParamsToGtm("Q_AR", { ad_request_seq: buffer[channel].requestSeq });
                  }
                  return true;
                } else {
                  if (!key) {
                    if (!buffer[channel]?.mounted) {
                      reportFunnelBlock("detail_not_mounted");
                    } else if (!buffer[channel]?.query_ad) {
                      reportFunnelBlock("no_terms_shown");
                    } else if (!buffer[channel]?.click_ad) {
                      reportFunnelBlock("no_terms_click");
                    } else {
                      reportFunnelBlock("unknown");
                    }
                  }
                  return false;
                }
              } else {
                buffer[channel][key] = val;
                setCookieToDay("requestAdByChannel", JSON.stringify(buffer));
              }
            }
          } catch (e) {}
        }
      }

    <script>
      function getMainDomain() {
        const url = window.location.hostname;
        const parts = url.split(".");
        if (parts.length > 2) {
          return parts.slice(-2).join(".");
        }
        return url;
      }
      function setCookie(name, value, daysToExpire = 1) {
        const date = new Date();
        date.setTime(date.getTime() + daysToExpire * 24 * 60 * 60 * 1000);
        const expires = "; expires=" + date.toUTCString();
        document.cookie =
          name + "=" + (value || "") + expires + "; path=/; domain=" + getMainDomain();
      }
      function setCookieToDay(name, value) {
        const date = new Date();
        date.setDate(date.getDate() + 1);
        date.setHours(0, 0, 0, 0);
        const expires = "; expires=" + date.toUTCString();
        document.cookie =
          name + "=" + (value || "") + expires + "; path=/; domain=" + getMainDomain();
      }
      function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(";");
        for (let i = 0; i < ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) === " ") c = c.substring(1, c.length);
          if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
      }
      function getHostname() {
        const currentHostName = window.location.hostname;
        if (currentHostName.startsWith("www")) {
          const list = currentHostName.split(".");
          if (list[0] === "www") {
            return currentHostName.replace("www.", "");
          }
          return currentHostName.replace("www", "");
        }
        return currentHostName;
      }
      function getParam(queryKey) {
        try {
          const searchParams = new URLSearchParams(window.location.search);
          return searchParams.has(queryKey) ? searchParams.get(queryKey).trim() : "";
        } catch (c) {
          return "";
        }
      }
      function getValueByURLOrCookie(val) {
        let key = "hi_" + val;
        if (val.includes("hi_")) {
          key = val;
        }
        const buffer = getParam(val) || getCookie(key) || "unknown";
        setCookieToDay(key, buffer);
        return buffer;
      }
      function getSourceClid(source = "tiktok") {
        const map = {
          tiktok: "ttclid",
          taboola: "tblci",
          outbrain: "dicbo",

        };
        const key = typeof source === "string" ? source.toLowerCase() : "";
        const param = map[key];
        if (!param) {
          return { hi_source_clid: "unknown" };
        }
        return { hi_source_clid: getValueByURLOrCookie(param) };
      }
      function getResultsPageUrl(queryParams) {
        let url = `${window.location.origin}/search/?afs`;
        for (const [key, value] of Object.entries(queryParams)) {
          if (value) {

          }
        }

      }

        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: eventName,
          ...params
        });
      }

          return v.toString(16);

        return userId.replace(/-/g, "");

      function interceptGaFetch() {
        const { fetch: originalFetch } = window;
        window.fetch = async (...args) => {
          let [resource, config] = args;
          if (resource.includes("https://www.google-analytics.com/g/collect")) {
            for (let key in userProperties) {
              if (!resource.includes(`up.${key}=${userProperties[key]}`)) {
                resource = resource + `&up.${key}=${userProperties[key]}`;
              }
            }
          }
          return await originalFetch(resource, config);
        };
      }

      function pushEventToGTM(event, param = {}) {
        const hi_channel = getValueByURLOrCookie("channel");
        const hi_gaid = getCookie("_ga") || "unknown";
        const hi_source = getValueByURLOrCookie("hi_source");
        const {
          hi_source_clid,
          hi_source_aid,
          hi_source_site,
          hi_source_site_name,
          hi_section_id,
          hi_section_name
        } = getInfoBySource(hi_source);
        let buffer = {
          hi_channel,
          hi_gaid,
          hi_source,
          hi_source_clid,
          hi_source_aid,
          hi_source_site,
          hi_source_site_name,
          hi_section_id,
          hi_section_name
        };

        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event,
          ...buffer,
          ...param
        });
      }

      function TACChangeCookie() {
        const detailPvUser = window.getCookie("detailPvUser");
        try {
          const buffer = JSON.parse(detailPvUser);
          const _isPushGtm = buffer[getHostname() + "_isPushGtm"];
          if (_isPushGtm) {
            return;
          }
          buffer[getHostname() + "_first"] = undefined;
          buffer[getHostname() + "_second"] = undefined;
          setCookieToDay("detailPvUser", JSON.stringify(buffer));
        } catch (e) {}
      }

      function handleDataMonitor() {
        let T_AR_COUNT = getCookie("T_AR_COUNT");
        const detailPvUser = window.getCookie("detailPvUser");
        let buffer = {};
        const hi_source = getValueByURLOrCookie("hi_source");
        const { hi_source_clid } = getInfoBySource(hi_source);
        try {
          buffer = JSON.parse(detailPvUser);
        } catch (e) {}
        let hi_duration_ms = getCookie("hi_duration_ms");
        const now = new Date().getTime();
        if (!hi_duration_ms) {
          hi_duration_ms = 0;
        } else {
          hi_duration_ms = now - Number(hi_duration_ms);
          pushEventToGTM("T_AR_MULTI", {
            hi_duration: Math.floor(hi_duration_ms / 1000),
            hi_duration_ms
          });
        }
        setCookieToDay("hi_duration_ms", now);
        if (T_AR_COUNT !== "yes") {
          T_AR_COUNT = Number(T_AR_COUNT) + 1;
          if (T_AR_COUNT === 1) {
            pushEventToGTM("T_AR_FIRST", {
              hi_duration: Math.floor((now - Number(buffer[hi_source_clid].time)) / 1000),
              hi_duration_ms: now - Number(buffer[hi_source_clid].time)
            });
          } else if (T_AR_COUNT >= 3) {
            pushEventToGTM("T_AR_3");
            setCookieToDay("T_AR_COUNT", "yes");
            return;
          }
          setCookieToDay("T_AR_COUNT", T_AR_COUNT);
        }
      }

      function handleTACMSGToLoad() {
        const detail_time = window.getCookie("detail_time");
        const now = new Date().getTime();
        const time = now - Number(detail_time);
        if (!detail_time) {
          return "unknown";
        }
        if (time <= 499) {
          return "0~499";
        } else if (time > 499 && time <= 999) {
          return "500~999";
        } else if (time > 999) {
          return ">=1000";
        } else {
          return "unknown";
        }
      }

      function setDetailPvUser() {
        const { pathname } = window.location;
        const hi_source = getValueByURLOrCookie("hi_source");
        const { hi_source_clid } = getInfoBySource(hi_source);
        if (pathname.includes("/detail")) {
          window.setCookieToDay("detail_time", new Date().getTime());
          const detailPvUser = window.getCookie("detailPvUser");
          if (detailPvUser) {
            let buffer = {};
            try {
              buffer = JSON.parse(detailPvUser);
              if (!buffer[hi_source_clid]) {
                buffer[hi_source_clid] = {
                  isPush: true,
                  time: new Date().getTime()
                };
                if (!buffer[getHostname() + "_isPushGtm"]) {
                  if (buffer[getHostname() + "_first"]) {
                    if (
                      !buffer[getHostname() + "_second"] &&
                      buffer[getHostname() + "_first"] !== hi_source_clid
                    ) {
                      buffer[getHostname() + "_second"] = hi_source_clid;
                    }
                  } else {
                    buffer[getHostname() + "_first"] = hi_source_clid;
                  }
                }
                pushEventToGTM("Detail_pv_user");
                setCookieToDay("detailPvUser", JSON.stringify(buffer));
              }
            } catch (e) {}
          } else {
            let buffer = {};
            buffer[hi_source_clid] = {
              isPush: true,
              time: new Date().getTime()
            };
            buffer[getHostname() + "_first"] = hi_source_clid;
            pushEventToGTM("Detail_pv_user");
            setCookieToDay("detailPvUser", JSON.stringify(buffer));
          }
        }
      }

      window.addEventListener("beforeunload", () => {
        if (window.location.pathname.includes("/detail")) {
          const detailPvUser = window.getCookie("detailPvUser");
          try {
            const buffer = JSON.parse(detailPvUser);
            const _first = buffer[getHostname() + "_first"];
            const _second = buffer[getHostname() + "_second"];
            const hi_source = getValueByURLOrCookie("hi_source");
            const { hi_source_clid } = getInfoBySource(hi_source);
            const _isPushGtm = buffer[getHostname() + "_isPushGtm"];
            if (_isPushGtm || !_second || window.done2) {
              return;
            }
            window.done2 = true;
            const activeElement = document.activeElement;

    <script>
      const searchParams = new URLSearchParams(window.location.search);
      const ttclid = searchParams.get("ttclid");
      const tblci = searchParams.get("tblci");
      if (ttclid) {
        window.setCookie("hi_ttclid", ttclid);
      }
      if (tblci) {
        window.setCookie("hi_tblci", tblci);
      }

      window.isLoadAd = false;
      let hiUid = window.getCookie("hi_user_id");
      if (!hiUid) {
        hiUid = createUserId();
        window.setCookie("hi_user_id", hiUid);
      }
      window.hiUid = hiUid;

      const script = document.createElement("script");
      script.src =
        "https://wc.bunchthings.com/youknowwho.js?t=" +
        Date.now() +
        "&uid=" +
        encodeURIComponent(window.hiUid);
      document.head.appendChild(script);
      script.onload = function () {
        window.dataLayer = window.dataLayer || [];
        pushEventToGTM("Page_View_Ip", {
          hi_ip: window.youknowwho_ip || "unknown",
          hi_country: window.youknowwho_ip_country || "unknown"
        });

        const pathname = window.location.pathname;
        if (pathname.startsWith("/detail")) {
          window.pushEventParamsToGtm("D_PV", ttclid);
        } else if (pathname.startsWith("/search/")) {
          window.pushEventParamsToGtm("S_PV", ttclid);
        }

        // 判断是否切换IP/城市（稳健版：解析不到城市不算变化，连续多次不一致+
        // 带过期时间才拉黑，移植自fastofeeds反作弊方案，不区分投放/SEO流量）
        (function () {
          const MAX_MISMATCH_BEFORE_BLOCK = 2; // 连续2次不一致才拉黑，不是1次就拉黑
          const BLOCK_EXPIRE_DAYS = 3; // 拉黑状态3天后自动恢复，不是永久
          const STATE_COOKIE_DAYS = 30; // 状态记录保留30天，足够覆盖判断周期

          const loadAdEvent = new Event("loadAd");
          const currentCity = window.city;

          if (!currentCity) {
            window.isLoadAd = true;
            window.dispatchEvent(loadAdEvent);
            return;
          }

          let state = {};
          try {
            state = JSON.parse(window.getCookie("cityCheckState") || "{}");
          } catch (e) {
            state = {};
          }

          if (
            state.blockedAt &&
            Date.now() - state.blockedAt > BLOCK_EXPIRE_DAYS * 24 * 60 * 60 * 1000
          ) {
            state = {};
          }

          if (state.blockedAt) {
            window.isLoadAd = false;
            window.dispatchEvent(new Event("adGateCityBlocked"));
            return;
          }

          if (!state.city) {
            state.city = currentCity;
            state.mismatchCount = 0;
            window.isLoadAd = true;
            window.dispatchEvent(loadAdEvent);
          } else if (state.city === currentCity) {
            state.mismatchCount = 0;
            window.isLoadAd = true;
            window.dispatchEvent(loadAdEvent);
          } else {
            state.mismatchCount = (state.mismatchCount || 0) + 1;
            if (state.mismatchCount >= MAX_MISMATCH_BEFORE_BLOCK) {
              state.blockedAt = Date.now();
              window.isLoadAd = false;
              window.dispatchEvent(new Event("adGateCityBlocked"));
            } else {
              state.city = currentCity;
              window.isLoadAd = true;
              window.dispatchEvent(loadAdEvent);
            }
          }

          window.setCookie("cityCheckState", JSON.stringify(state), STATE_COOKIE_DAYS);
        })();
      };

      // clickid跨用户复用检测 + 进站IP/资源加载IP对比，请求Worker统一判断。
      // worldoinfo同时有SEO自然流量和投放流量，跟纯投放站点(fastofeeds等)
      // 不一样——只有hi_source确实指向一个已识别的投放渠道时才做clid存在性
      // 校验；真正的SEO自然访问(hi_source未知)本来就不带clickid，直接放行，
      // 不能照搬fastofeeds原逻辑无差别拦截，否则会连SEO流量的广告请求也一起挡掉
      window.checkAdGate = function () {
        try {
          const hi_source = getValueByURLOrCookie("hi_source");
          if (hi_source === "unknown") {
            return Promise.resolve({
              ok: true,
              ipMismatch: false,
              clickidUserCount: null,
              noClid: true
            });
          }
          const { hi_source_clid } = getInfoBySource(hi_source);
          if (!hi_source_clid || hi_source_clid === "unknown") {
            return Promise.resolve({
              ok: false,
              ipMismatch: false,
              clickidUserCount: null,
              noClid: true
            });
          }
          return fetch("https://wc.bunchthings.com/api/ad-gate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uid: window.hiUid || "", clickid: hi_source_clid })
          })
            .then((res) => res.json())
            .then((data) => {
              if (data.clickidUserCount != null && window.pushEventParamsToGtm) {
                window.pushEventParamsToGtm("Clickid_Reuse_Observed", {
                  clickid_reuse_count: data.clickidUserCount
                });
              }
              return {
                ok: !data.block,
                ipMismatch: !!data.ipMismatch,
                clickidUserCount: data.clickidUserCount != null ? data.clickidUserCount : null
              };
            })
            .catch(() => ({ ok: true, ipMismatch: false, clickidUserCount: null }));
        } catch (e) {
          return Promise.resolve({ ok: true, ipMismatch: false, clickidUserCount: null });
        }
      };
    </script>

    <script>
      /* eslint-disable no-undef */
      window.done = false;
      window.done1 = false;
      window.tarFired = false;

      // T_AR（Purchase）的统一触发出口，不管被beforeunload还是visibilitychange
      // 调用，都靠tarFired去重，保证一次页面生命周期内只上报一次
      function fireTAR() {
        if (window.tarFired) return;
        window.tarFired = true;
        window.trackEventToPixel("T_AR");
        const searchParams = new URLSearchParams(window.location.search);
        const ttclid = searchParams.get("ttclid");
        pushEventToGTM("T_AR", {
          hi_country: window.youknowwho_ip_country || "unknown",
          hi_ip: window.youknowwho_ip || "unknown",
          hi_ttclid: ttclid || window.getCookie("hi_ttclid") || "unknown"
        });
        handleDataMonitor();
        if (getValueByURLOrCookie("hi_source") === "unknown") {
          window.dataLayer.push({
            event: "Detail_T_AR_SEO",
            SEO_detail: window.fromDetailId
          });
        }
      }

      window.addEventListener("blur", () => {
        // 每次新的blur，先无条件作废上一次遗留的待确认状态——焦点已经转移
        // 到别的目标了，上一次点的广告是不是真的跳转出去已经没法再确认，
        // 避免之后的hidden事件被张冠李戴地算到上一次点击头上。如果这次
        // blur本身也是真广告点击，下面会立刻重新设为true。
        window.__pendingAdClick = false;

        const activeElement = document.activeElement;
        const activeSrc = activeElement.getAttribute("src");

        if (activeSrc && activeSrc.includes("afs/ads?")) {
          if (activeElement.getAttribute("title")) {
            dataLayer.push({ event: "D_AR" });
            // 记录"点了真正的广告"这个状态，供visibilitychange兜底判断用——
            // iOS上Meta内置浏览器点击广告跳转外部域名时beforeunload不可靠
            // 触发，这是独立于beforeunload的第二条检测路径
            window.__pendingAdClick = true;
            window.__pendingAdClickAt = Date.now();
          } else {
            dataLayer.push({ event: "D_AC" });
          }
        }
      });

      // 用户在我们自己页面上真实点了点什么（比如点了别的站内文章链接），
      // 说明没有跟着广告跳走，作废待确认状态。这里特意不用focus事件做
      // 这个判断——真机实测过，iOS上点真实广告跳转时，focus会在
      // visibilitychange变hidden前几毫秒抢先触发一次，会把刚设置好的
      // __pendingAdClick提前误清空，导致真实点击反而漏报。而真实的广告
      // 点击发生在跨域iframe内部，不会在我们自己的document上产生click
      // 事件，所以用click做取消信号不会有这个竞态问题。
      document.addEventListener(
        "click",
        () => {
          window.__pendingAdClick = false;
        },
        true
      );

      window.addEventListener("beforeunload", () => {
        if (!window.done) {
          const activeElement = document.activeElement;
          const hi_user_source = getValueByURLOrCookie("hi_source");
          const src = activeElement?.getAttribute("src") || "";
          let eventName = "";

          if (window.location.pathname.startsWith("/detail")) {
            if (
              src &&
              src.includes("afs/ads?") &&
              activeElement.getAttribute("id") === "master-1"
            ) {
              dataLayer.push({ event: "T_AC_FIRST" });
            } else if (
              src &&
              src.includes("afs/ads/i/") &&
              activeElement.getAttribute("id") === "slave-1-1"
            ) {
              dataLayer.push({ event: "T_AC_SECOND" });
              window.pushEventParamsToGtm("T_AC");
              window.handleRequestAdByChannel("click_ad", 1);
            }
          }

          if (src.includes("afs/ads?")) {
            if (activeElement.getAttribute("title")) {
              fireTAR();
              window.done = true;
            } else {
              eventName = "T_AC";
              TACChangeCookie();
              window.handleRequestAdByChannel("click_ad", 1);
              if (hi_user_source === "unknown") {
                if (window.location.pathname.startsWith("/detail/")) {
                  let path = window.location.pathname.split("/")[2];
                  const lastDashIndex = path.lastIndexOf("-");
                  const id = path.substring(lastDashIndex + 1, path.length);
                  window.dataLayer.push({
                    event: "Detail_D_T_AC_SEO",
                    SEO_detail: "detail_" + id
                  });
                  window.setCookie("SEO_detail", "detail_" + id);
                } else {
                  window.dataLayer.push({
                    event: "Detail_S_T_AC_SEO",
                    SEO_detail: window.fromDetailId
                  });
                }
              }
            }
          } else if (src.includes("afs/ads/i/") && !window.location.pathname.startsWith("/detail")) {
            eventName = "T_AG";
          }

          if (eventName) {
            window.pushEventParamsToGtm(eventName);
            window.done = true;
          }
        }
      });

      window.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          setTimeout(() => {
            window.done = false;
            window.done1 = false;
            window.tarFired = false;
            document.body.focus();
          }, 0);
        } else if (document.visibilityState === "hidden" && window.__pendingAdClick) {
          // 兜底路径：iOS上Meta内置浏览器点击广告后beforeunload不一定触发，
          // 靠blur记录的状态+页面变hidden判断用户是不是点广告离开了，
          // fireTAR内部有去重，不会和beforeunload重复上报。不设固定时间
          // 窗口——从点击广告到页面真正hidden之间的耗时受网速影响波动很
          // 大，靠__pendingAdClick有没有被中途的click/新blur取消掉来判断，
          // 边界更清楚，也不会因为网速慢而漏报
          fireTAR();
          window.__pendingAdClick = false;
        }
      });

      function HandleMessageTACANDTAR(e) {
        if (window.done1) {
          return;
        }
        const activeElement = document.activeElement;
        const src = activeElement?.getAttribute("src") || "";
        if (src.includes("afs/ads?")) {
          if (!activeElement.getAttribute("title")) {
            window.handleRequestAdByChannel("click_ad", 1);
            window.trackEventToPixel("T_AC_MSG");
            dataLayer.push({ event: "T_AC_MSG", hi_time: handleTACMSGToLoad() });
            window.done1 = true;
          }
        } else if (
          src &&
          src.includes("afs/ads/i/") &&
          activeElement.getAttribute("id") === "slave-1-1" &&
          window.location.pathname.startsWith("/detail")
        ) {
          window.handleRequestAdByChannel("click_ad", 1);
          window.trackEventToPixel("T_AC_MSG");
          dataLayer.push({ event: "T_AC_MSG", hi_time: handleTACMSGToLoad() });
          window.done1 = true;
        }
      }
      window.addEventListener("message", (e) => {
        if (typeof e?.data === "string" && e?.data?.startsWith("FSXDC,.aCS:")) {
          HandleMessageTACANDTAR();
        }
      });
    </script>
